name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend Image Build and Push
        run: |
          docker build -t rajasingh8890/backend:latest ./backend
          docker push rajasingh8890/backend:latest

      - name: Frontend Image Build and Push
        run: |
          docker build -t rajasingh8890/frontend:latest ./frontend
          docker push rajasingh8890/frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull rajasingh8890/backend:latest
            docker pull rajasingh8890/frontend:latest
            cd /home/ubuntu/app
            docker compose down
            docker compose up -d
